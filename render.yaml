services:
  - type: web
    name: storymode-api
    runtime: node
    plan: free
    branch: backend-local-implementation
    buildCommand: npm run api:render:build
    startCommand: npm run api:hosted:free
    healthCheckPath: /readyz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: AIST_API_HOST
        value: 0.0.0.0
      - key: AIST_TRUST_PROXY_HOPS
        value: 1
      - key: AIST_API_ALLOW_LOCAL_GOOGLE_STUB
        value: "false"
      - key: AIST_POLICY_MODE
        value: reviewOnly
      - key: AIST_EMAIL_DELIVERY_MODE
        value: disabled
      - key: AIST_PASSWORD_SIGNUP_MODE
        value: trustedInvite
      - key: AIST_DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: AIST_API_ALLOWED_ORIGINS
        sync: false
      - key: AIST_WEB_APP_URL
        sync: false
      - key: AIST_ADMIN_EMAILS
        sync: false
      - key: AIST_PROVIDER_API_KEY
        sync: false
      - key: AIST_GOOGLE_CLIENT_ID
        sync: false
      - key: AIST_GOOGLE_CLIENT_SECRET
        sync: false
      - key: AIST_GOOGLE_REDIRECT_URI
        sync: false
