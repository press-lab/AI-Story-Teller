name: Deploy to GitHub Pages

on:
  # The public frontend is deployed from press-lab/AI-Story-Teller-Pages.
  # Keep this legacy workflow manual-only; private-repository Pages is unsupported.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_AIST_API_BASE_URL: ${{ vars.AIST_PUBLIC_API_BASE_URL }}
          VITE_AIST_RUNTIME_MODE: hosted
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy_primary.outputs.page_url || steps.deploy_retry.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deploy_primary
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying Pages deploy
        if: steps.deploy_primary.outcome == 'failure'
        run: sleep 20

      - name: Retry deploy to GitHub Pages
        if: steps.deploy_primary.outcome == 'failure'
        id: deploy_retry
        uses: actions/deploy-pages@v5
