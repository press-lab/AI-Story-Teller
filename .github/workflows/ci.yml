name: CI

on:
  push:
    branches: [main, backend-local-implementation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aist
          POSTGRES_PASSWORD: aist
          POSTGRES_DB: aist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aist -d aist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Postgres integration tests
        env:
          TEST_POSTGRES_URL: postgres://aist:aist@127.0.0.1:5432/aist_test
        run: npm run api:test:postgres

      - name: Build
        run: npm run build

      - name: Build hosted API
        run: npm run api:build

      - name: Hosted API production smoke
        env:
          DATABASE_URL: postgres://aist:aist@127.0.0.1:5432/aist_test
        run: npm run api:smoke

      - name: Production smoke
        run: npm run smoke:prod

  render-deployment-parity:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aist
          POSTGRES_PASSWORD: aist
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aist -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Run exact Render build
        env:
          NODE_ENV: production
        run: npm run api:render:build

      - name: Verify Render deployment parity
        env:
          NODE_ENV: production
          TEST_POSTGRES_ADMIN_URL: postgres://aist:aist@127.0.0.1:5432/postgres
        run: npm run api:deploy:parity
